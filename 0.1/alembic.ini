# Alembic — gpwbot (S01).
# Uwaga: `script_location` jest względne od CWD; programowe wywołania
# (`gpwbot.db.migrate`) nadpisują je jawnie, więc komendy działają z dowolnego katalogu.

[alembic]
script_location = src/gpwbot/db/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url =
