# Seed instrumentów universe (S04): skład WIG20 + mWIG40.
#
# UWAGA — DANE DO WERYFIKACJI (V-05, docs/decisions.md):
# - Tickery WIG20: sekcja "Mapa wartości spółek z WIG20" na stronie głównej gpw.pl
#   (dostęp 2026-10-20). Część symboli odbiega od znanych mi nazw (np. TAURONPE,
#   MODIVO, KETY, ALIOR) — możliwe zmiany tickerów po 2025 lub błąd ekstrakcji;
#   zweryfikować przed startem forward testu.
# - mWIG40: lista NAZW spółek z pl.wikipedia.org/wiki/mWIG40 (dostęp 2026-10-20);
#   tickery to mapowanie agenta — niezweryfikowane. Spółki bez pewnego tickera
#   pominięte (do uzupełnienia): Asbis, Benefit Systems, cyber_Folks, Grenevia,
#   Grupa Pracuj, Huuuge Games, Mo-Bruk, Ten Square Games, Text. Tauron figuruje
#   w WIG20 (wg gpw.pl; zmiana składu 2026-03-20 wg historii na Wikipedii).
# - isin/sector: puste lub przybliżone — do uzupełnienia z oficjalnego źródła.
#
# Format wpisu: ticker, isin?, name?, segment?, sector?, indices (wig20/mwig40),
# tick_group, aliases?

