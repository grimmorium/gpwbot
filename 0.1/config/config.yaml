# gpwbot — przykładowa konfiguracja (wartości z Części I sekcji 2 i 5).
# Ścieżki względne są rozwiązywane względem katalogu tego pliku.

timezone: Europe/Warsaw

paths:
  db_path: data/gpwbot.db
  data_dir: data
  raw_dir: data/raw
  reports_dir: reports

# Godziny faz zweryfikowane w S02 wg SZOG GPW §5(1)(1) (D-014): aukcja otwarcia 8:30–9:00.
market:
  preopen_start: "08:30"
  preopen_end: "09:00"
  continuous_start: "09:00"
  continuous_end: "16:50"
  close_auction_start: "16:50"
  close_auction_end: "17:00"
  settlement_days: 2
  settle_instantly: false
  price_limit_pct: 10

portfolio:
  initial_cash_pln: 100000
  benchmarks: [wig, wig20]
  portfolios:
    - id: llm_agent
      strategy: llm
    - id: baseline_momentum
      strategy: momentum

universe:
  indices: [wig20, mwig40]
  min_avg_turnover_pln_20d: 500000   # średni obrót 20 sesji (Część I sekcja 8)
  min_history_sessions: 250         # minimum sesji historii (S04, D-027)
  min_price_pln: 1
  exclude_tickers: []

runs:
  - name: morning
    hour: 8
    minute: 15
  - name: evening
    hour: 17
    minute: 30

llm:
  base_url: http://localhost:8080/v1
  temperature: 0.2
  max_prompt_tokens: 6000
  samples_per_decision: 1
  thinking_extraction: false
  thinking_decision: true

risk:
  max_position_pct: 10
  max_positions: 10
  min_cash_pct: 10
  max_sector_pct: 30
  max_daily_turnover_pct: 30
  min_trade_value_pln: 2000
  max_adv_participation_pct: 5
  stop_atr_mult: 2.5
  min_holding_sessions: 3
  cooldown_after_sell_sessions: 5
  kill_switch_drawdown_pct: 15

costs:
  commission_pct: 0.30
  commission_min_pln: 5
  slippage_bps: 15
  max_volume_participation_pct: 5   # udział zlecenia w wolumenie sesji (S07, D-041)

# Adaptery danych (S03): limity wyłącznie tutaj, nie w kodzie.
providers:
  stooq:
    requests_per_second: 1.0   # prosty limiter zapytań
    timeout_seconds: 30.0
    max_retries: 3             # ponawiane: 5xx i timeouty; 4xx — nie
    retry_backoff_base_s: 0.5  # wykładniczy backoff (mnożnik)
  yfinance:
    enabled: false             # zapasowy, nieoficjalny adapter (.WA)

# Sekcje placeholder — pola rozszerzane w sesjach S09/S10–S12/S14 (decyzja D-001).
screener:
  top_n: 25
  max_total: 40
  materiality_threshold: 0.6
  # Wagi scoringu przekrojowego (S05, D-032): neutralne domyślne — kalibracja poza S05.
  weight_mom_6m: 1.0
  weight_mom_12_1: 1.0
  weight_trend: 1.0
  weight_low_vol: 1.0   # cecha = atr_pct (ATR14/cena), ranga inwersyjna
  weight_vol_z: 1.0

baseline:
  top_k: 10
  rebalance_sessions: 5

text:
  dedupe_similarity: 92
  extraction_temperature: 0.0

eval:
  min_forward_days: 90
